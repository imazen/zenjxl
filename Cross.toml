# Cross configuration for cross-compilation and testing.
# See: https://github.com/cross-rs/cross
#
# Native build dependencies resolve from pinned Git sources. Only decoder
# test resources still use a sibling mount.

[build.env]
passthrough = [
    "RUST_BACKTRACE",
    "RUST_LOG",
]
volumes = ["ZENJXL_DECODER_DIR"]
