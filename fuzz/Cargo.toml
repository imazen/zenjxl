[package]
name = "zenjxl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Unpublished shared inventory contract; keep this revision aligned with the wrapper.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }

[dependencies.zenjxl]
path = ".."
default-features = false
features = ["inventory"]

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }

# Same reviewed decoder behavior revision as the wrapper root.
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "b6c9cf6e4d703d5f9a2e62c3ca0e859bbf2d2cd7" }
