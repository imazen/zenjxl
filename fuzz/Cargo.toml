[package]
name = "zenjxl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# TEMPORARY: zencodec PR (structural inventories); swap for the released version before merge.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "c1c3292ff10f386191780ad407526951165da47a" }

[dependencies.zenjxl]
path = ".."
default-features = false
features = ["inventory"]

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "c1c3292ff10f386191780ad407526951165da47a" }
# TEMPORARY: swap before merge: zenjxl-decoder#62 (lean scan_frames_only, codestream_length).
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "f27c5c6fb56b76c952d88aa7d5231a06f7e49b51" }
